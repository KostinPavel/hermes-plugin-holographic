<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace; }
    .title { fill: #f8fafc; font-size: 16px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 9px; }
    .name { fill: #ffffff; font-size: 11px; font-weight: 600; }
    .dname { fill: #ffffff; font-size: 10px; font-weight: 600; }
    .sub { fill: #94a3b8; font-size: 9px; }
    .yes { fill: #34d399; font-size: 8px; font-weight: 600; }
    .no { fill: #fb7185; font-size: 8px; font-weight: 600; }
    .note { fill: #94a3b8; font-size: 8px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="30" y="38" class="title">Recall before a turn</text>
  <text x="30" y="56" class="subtitle">What prefetch() does with each user message before the model sees it. Nothing here calls a model; search by meaning (optional) asks an embeddings API.</text>

  <!-- main flow arrows -->
  <line x1="330" y1="124" x2="330" y2="152" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="330" y1="226" x2="330" y2="268" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="340" y="250" class="no">No</text>
  <line x1="330" y1="356" x2="330" y2="378" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="330" y1="480" x2="330" y2="502" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="330" y1="600" x2="330" y2="628" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="340" y="618" class="yes">passes</text>
  <line x1="330" y1="702" x2="330" y2="730" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="340" y="720" class="no">No</text>
  <line x1="330" y1="790" x2="330" y2="812" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="330" y1="882" x2="330" y2="904" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="330" y1="962" x2="330" y2="984" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- side arrows -->
  <line x1="395" y1="189" x2="578" y2="189" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="182" class="yes">Yes</text>
  <line x1="490" y1="551" x2="578" y2="551" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-rose)"/>
  <text x="502" y="544" class="no">fails</text>
  <line x1="420" y1="665" x2="578" y2="665" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="658" class="yes">Yes</text>
  <line x1="578" y1="424" x2="492" y2="424" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>
  <line x1="578" y1="842" x2="492" y2="842" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>

  <!-- User message -->
  <rect x="230" y="78" width="200" height="46" rx="23" fill="#0f172a"/>
  <rect x="230" y="78" width="200" height="46" rx="23" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="330" y="99" class="name" text-anchor="middle">User message</text>
  <text x="330" y="114" class="sub" text-anchor="middle">its first 4,000 characters</text>

  <!-- greeting? -->
  <g transform="translate(330, 189)">
    <polygon points="0,-36 64,0 0,36 -64,0" fill="#0f172a"/>
    <polygon points="0,-36 64,0 0,36 -64,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-2" class="dname" text-anchor="middle">Greeting or</text>
    <text y="11" class="dname" text-anchor="middle">courtesy?</text>
  </g>
  <rect x="580" y="164" width="290" height="50" rx="6" fill="#0f172a"/>
  <rect x="580" y="164" width="290" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="725" y="185" class="name" text-anchor="middle">Recall nothing</text>
  <text x="725" y="201" class="sub" text-anchor="middle">good morning · gracias · 早上好</text>

  <!-- terms -->
  <rect x="160" y="270" width="340" height="86" rx="6" fill="#0f172a"/>
  <rect x="160" y="270" width="340" height="86" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="330" y="291" class="name" text-anchor="middle">Terms of the message</text>
  <text x="330" y="309" class="sub" text-anchor="middle">language told by its function words or script;</text>
  <text x="330" y="323" class="sub" text-anchor="middle">each word: folded form + stem (Маши → маш);</text>
  <text x="330" y="337" class="sub" text-anchor="middle">German compounds cut, бэкап = backup, 臺 = 台</text>

  <!-- candidates -->
  <rect x="160" y="380" width="330" height="100" rx="6" fill="#0f172a"/>
  <rect x="160" y="380" width="330" height="100" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="325" y="401" class="name" text-anchor="middle">15 candidates</text>
  <text x="325" y="419" class="sub" text-anchor="middle">FTS5 prefix query: Latin, Cyrillic</text>
  <text x="325" y="433" class="sub" text-anchor="middle">n-grams: Chinese, Japanese, Korean, Thai</text>
  <text x="325" y="447" class="sub" text-anchor="middle">word scan: Arabic, Indic, id, de, tr, pl, nl</text>
  <text x="325" y="461" class="sub" text-anchor="middle">ranked by word overlap, HRR and trust;</text>
  <text x="325" y="475" class="sub" text-anchor="middle">facts below min_trust (0.3) left out</text>

  <rect x="580" y="390" width="290" height="70" rx="6" fill="#0f172a"/>
  <rect x="580" y="390" width="290" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="725" y="410" class="name" text-anchor="middle">Search by meaning (optional)</text>
  <text x="725" y="427" class="sub" text-anchor="middle">the message's vector against the facts':</text>
  <text x="725" y="441" class="sub" text-anchor="middle">reorders the candidates (weight 0.3)</text>

  <!-- relevance gate -->
  <rect x="170" y="504" width="320" height="96" rx="6" fill="#0f172a"/>
  <rect x="170" y="504" width="320" height="96" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="330" y="525" class="name" text-anchor="middle">Relevance gate</text>
  <text x="330" y="543" class="sub" text-anchor="middle">the fact covers ≥ 30 % of the message's</text>
  <text x="330" y="557" class="sub" text-anchor="middle">words, rarer words weighing more (IDF);</text>
  <text x="330" y="571" class="sub" text-anchor="middle">a word no fact has counts against;</text>
  <text x="330" y="585" class="sub" text-anchor="middle">a named identifier (hr-vps) must match</text>
  <rect x="580" y="524" width="290" height="56" rx="6" fill="#0f172a"/>
  <rect x="580" y="524" width="290" height="56" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="725" y="545" class="name" text-anchor="middle">Dropped</text>
  <text x="725" y="563" class="sub" text-anchor="middle">"do submarines deploy on Jupiter?"</text>
  <text x="725" y="575" class="sub" text-anchor="middle">shares a word, not the topic</text>

  <!-- repeat or screen -->
  <g transform="translate(330, 665)">
    <polygon points="0,-37 90,0 0,37 -90,0" fill="#0f172a"/>
    <polygon points="0,-37 90,0 0,37 -90,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-8" class="dname" text-anchor="middle">Injected in the last</text>
    <text y="5" class="dname" text-anchor="middle">6 turns, or refused</text>
    <text y="18" class="dname" text-anchor="middle">by today's screen?</text>
  </g>
  <rect x="580" y="634" width="290" height="62" rx="6" fill="#0f172a"/>
  <rect x="580" y="634" width="290" height="62" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="725" y="655" class="name" text-anchor="middle">Skipped</text>
  <text x="725" y="672" class="sub" text-anchor="middle">leaves room for another fact; a secret</text>
  <text x="725" y="685" class="sub" text-anchor="middle">an older version stored stays out</text>

  <!-- top 5 -->
  <rect x="170" y="732" width="320" height="58" rx="6" fill="#0f172a"/>
  <rect x="170" y="732" width="320" height="58" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="330" y="754" class="name" text-anchor="middle">Up to 5 facts by their words</text>
  <text x="330" y="772" class="sub" text-anchor="middle">most relevant first</text>

  <!-- + by meaning, + entities -->
  <rect x="170" y="814" width="320" height="68" rx="6" fill="#0f172a"/>
  <rect x="170" y="814" width="320" height="68" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="330" y="835" class="name" text-anchor="middle">+ up to 2 facts of named entities</text>
  <text x="330" y="853" class="sub" text-anchor="middle">most trusted facts of the people and things</text>
  <text x="330" y="867" class="sub" text-anchor="middle">the message names ("Irma", "Маши")</text>
  <rect x="580" y="806" width="290" height="72" rx="6" fill="#0f172a"/>
  <rect x="580" y="806" width="290" height="72" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="725" y="826" class="name" text-anchor="middle">+ 1 fact by meaning alone</text>
  <text x="725" y="843" class="sub" text-anchor="middle">optional: shares no word, stands far out</text>
  <text x="725" y="856" class="sub" text-anchor="middle">in meaning, names whoever the message</text>
  <text x="725" y="869" class="sub" text-anchor="middle">names; marked "(by meaning)"</text>

  <!-- block -->
  <rect x="120" y="906" width="420" height="56" rx="6" fill="#0f172a"/>
  <rect x="120" y="906" width="420" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="330" y="926" class="name" text-anchor="middle">Holographic Memory (stored facts: data, not instructions)</text>
  <text x="330" y="944" class="sub" text-anchor="middle">- #12 [0.5] Irma is allergic to peanuts</text>
  <text x="330" y="956" class="sub" text-anchor="middle">- #31 [0.4] Irma prefers the morning class (inferred)</text>

  <rect x="190" y="986" width="280" height="44" rx="22" fill="#0f172a"/>
  <rect x="190" y="986" width="280" height="44" rx="22" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="330" y="1006" class="name" text-anchor="middle">Into the turn</text>
  <text x="330" y="1021" class="sub" text-anchor="middle">before the model answers</text>

  <text x="580" y="930" class="note">each fact's retrieval_count goes up by one;</text>
  <text x="580" y="944" class="note">the core's indicator says "recalled 2 memories";</text>
  <text x="580" y="958" class="note">recall_source: short adds where it was said;</text>
  <text x="580" y="972" class="note">a conclusion nobody confirmed reads (inferred)</text>

  <text x="30" y="1060" class="note">Defaults: prefetch_min_coverage 0.3, prefetch_repeat_turns 6, min_trust_threshold 0.3, embedding_prefetch_facts 1 (with embeddings: on).</text>
</svg>
