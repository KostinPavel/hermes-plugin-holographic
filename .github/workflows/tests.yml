name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        core: [main]  # core's main: its breaking changes show here first, and the catalog checks against it too
        include:
          # and the latest core release, what users and Mia run (Linux): main moving on must not hide that
          - os: ubuntu-latest
            core: release
    runs-on: ${{ matrix.os }}
    # A hung test stops here, not at GitHub's default of 6 hours (Windows, the slowest, took up to 30 minutes).
    timeout-minutes: 40
    steps:
      - name: Allow long paths (hermes-agent's docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0  # tags: tests/test_holographic_compat.py runs v0.1.1 from its tag
      - name: Pick the core ref
        id: core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.core }}" = release ]; then
            ref=$(gh release view --repo NousResearch/hermes-agent --json tagName --jq .tagName)
          else
            ref=main
          fi
          echo "core ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # The plugin imports Hermes core (agent, tools, hermes_cli) from a checkout, the way an installed plugin does.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
          ref: ${{ steps.core.outputs.ref }}
      # Hermes core gates every runtime dependency on python_version >= '3.14'; older Pythons install none of them.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Through uv with core's own [tool.uv] override-dependencies: since 2026-10-22 core pins Pillow 13 while its
      # browser-harness pins 12.3, and only the override reconciles them; plain pip cannot resolve core at all.
      - name: Install hermes-agent and this plugin's declared dependencies
        shell: bash
        run: |
          python -m pip install "uv==0.13.3"
          python -c "import tomllib; print('\n'.join(tomllib.load(open('hermes-agent/pyproject.toml', 'rb')).get('tool', {}).get('uv', {}).get('override-dependencies', [])))" > hermes-overrides.txt
          python -m uv pip install --system --overrides hermes-overrides.txt -e ./hermes-agent "pytest==9.1.1"
          python -c "import tomllib; print('\n'.join(tomllib.load(open('plugin/pyproject.toml', 'rb'))['project']['dependencies']))" > plugin-deps.txt
          python -m uv pip install --system --overrides hermes-overrides.txt -r plugin-deps.txt
      - name: Run the plugin suite
        working-directory: plugin
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q --durations=25  # the slowest tests, so a slowdown shows in the log

  # Lint: the rules in pyproject.toml (pyflakes, pycodestyle, bugbear); a test proves behaviour, this catches an
  # unused import or a mutable default before review does.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "ruff==0.15.16"
      - run: ruff check .

  # The same check the Hermes plugin catalog runs on an entry at its pinned commit.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install hermes-agent (through uv with core's overrides, as in pytest above)
        run: |
          python -m pip install "uv==0.13.3"
          python -c "import tomllib; print('\n'.join(tomllib.load(open('hermes-agent/pyproject.toml', 'rb')).get('tool', {}).get('uv', {}).get('override-dependencies', [])))" > hermes-overrides.txt
          python -m uv pip install --system --overrides hermes-overrides.txt -e ./hermes-agent
      - name: hermes plugins validate
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes plugins validate --install-deps "$GITHUB_WORKSPACE/plugin" </dev/null
