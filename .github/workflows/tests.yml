name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Allow long paths (hermes-agent's docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0  # tags: tests/test_holographic_compat.py runs v0.1.1 from its tag
      # The plugin imports Hermes core (agent, tools, hermes_cli) from a checkout, the way an installed plugin does.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      # Hermes core gates every runtime dependency on python_version >= '3.14'; older Pythons install none of them.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install hermes-agent and this plugin's declared dependencies
        shell: bash
        run: |
          python -m pip install -e ./hermes-agent "pytest==9.1.1"
          python -c "import tomllib; print('\n'.join(tomllib.load(open('plugin/pyproject.toml', 'rb'))['project']['dependencies']))" > plugin-deps.txt
          python -m pip install -r plugin-deps.txt
      - name: Run the plugin suite
        working-directory: plugin
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q

  # Lint: the rules in pyproject.toml (pyflakes, pycodestyle, bugbear); a test proves behaviour, this catches an
  # unused import or a mutable default before review does.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "ruff==0.15.16"
      - run: ruff check .

  # The same check the Hermes plugin catalog runs on an entry at its pinned commit.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install hermes-agent
        run: python -m pip install -e ./hermes-agent
      - name: hermes plugins validate
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes plugins validate --install-deps "$GITHUB_WORKSPACE/plugin" </dev/null
